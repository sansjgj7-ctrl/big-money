<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Big Money</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07110d;
  color:#f2fff7;
  font-family:Arial,sans-serif
}
.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding:18px 16px 92px
}
h1,h2,p{margin:0}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}
.logo{font-size:25px;font-weight:800}
.pill{
  background:#10271c;
  border:1px solid #214b35;
  padding:8px 12px;
  border-radius:20px;
  color:#8ff0b4
}
.card{
  background:linear-gradient(145deg,#10251a,#0a1811);
  border:1px solid #1d4a32;
  border-radius:20px;
  padding:20px;
  margin:12px 0;
  box-shadow:0 10px 30px #0005
}
.balance{
  font-size:34px;
  font-weight:800;
  margin:10px 0
}
.muted{color:#8fa99b;font-size:13px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  font-weight:700;
  background:#22c55e;
  color:#041009;
  cursor:pointer
}
button.secondary{
  background:#10271c;
  color:#a9f6c4;
  border:1px solid #245239
}
input{
  width:100%;
  padding:14px;
  border-radius:13px;
  border:1px solid #28513a;
  background:#07140d;
  color:white;
  outline:none;
  margin:7px 0 10px
}
.section{display:none}
.section.active{display:block}
.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center
}
.stat{
  font-size:20px;
  font-weight:800
}
.item{
  padding:14px 0;
  border-bottom:1px solid #193524
}
.item:last-child{border:0}
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#07110df2;
  border-top:1px solid #183725;
  display:flex;
  justify-content:center;
  z-index:5
}
.navin{
  max-width:520px;
  width:100%;
  display:grid;
  grid-template-columns:repeat(5,1fr)
}
.nav button{
  background:transparent;
  color:#789385;
  border-radius:0;
  padding:11px 3px;
  font-size:11px
}
.nav button.active{color:#5df08d}
.icon{
  font-size:20px;
  display:block;
  margin-bottom:3px
}
.qr{
  display:flex;
  justify-content:center;
  background:white;
  border-radius:14px;
  padding:10px;
  margin:12px auto;
  width:190px
}
.qr img{
  width:170px;
  height:170px
}
.badge{
  padding:5px 9px;
  border-radius:12px;
  background:#162d21;
  color:#75efa2;
  font-size:11px
}
.notice{
  background:#241f0c;
  border:1px solid #5c4b16;
  color:#eadb86;
  padding:12px;
  border-radius:13px;
  font-size:12px;
  line-height:1.5
}
.success{
  background:#0e2b1b;
  border:1px solid #24613c;
  color:#9cf4b8;
  padding:12px;
  border-radius:13px;
  margin-top:10px;
  font-size:12px
}
.error{
  background:#321416;
  border:1px solid #713238;
  color:#ffb9be;
  padding:12px;
  border-radius:13px;
  margin-top:10px;
  font-size:12px
}
</style>
</head>

<body>

<div class="app">

<div class="top">
  <div class="logo">💚 Big Money</div>
  <div class="pill">USDT · TRC20</div>
</div>

<!-- HOME -->
<section id="home" class="section active">

<div class="card">
  <div class="muted">Total Balance</div>
  <div class="balance" id="balance">0.0000 USDT</div>

  <div class="grid">
    <button onclick="show('deposit')">Deposit</button>
    <button class="secondary" onclick="show('withdraw')">Withdraw</button>
  </div>
</div>

<div class="card">
  <div class="row">
    <h2>Daily Reward</h2>
    <span class="badge">+0.1000</span>
  </div>

  <p class="muted" style="margin:8px 0 12px">
    Claim your daily demo reward.
  </p>

  <button onclick="claimReward()">Claim Reward</button>
</div>

<div class="grid">

<div class="card">
  <div class="muted">Referrals</div>
  <div class="stat" id="refs">0</div>
</div>

<div class="card">
  <div class="muted">Transactions</div>
  <div class="stat" id="txcount">0</div>
</div>

</div>

<div class="card">
  <h2>Quick Actions</h2>

  <div class="grid" style="margin-top:12px">
    <button class="secondary" onclick="show('send')">
      Send USDT
    </button>

    <button class="secondary" onclick="show('profile')">
      Profile
    </button>
  </div>
</div>

</section>

<!-- DEPOSIT -->
<section id="deposit" class="section">

<div class="card">

<h2>💰 Deposit USDT</h2>

<p class="muted" style="margin-top:6px">
Network: TRON (TRC20)
</p>

<label>Amount (USDT)</label>

<input
  id="depAmount"
  type="number"
  min="1"
  step="0.01"
  placeholder="Enter amount"
>

<div class="grid">

<button class="secondary" onclick="setDep(10)">10</button>
<button class="secondary" onclick="setDep(20)">20</button>
<button class="secondary" onclick="setDep(50)">50</button>
<button class="secondary" onclick="setDep(100)">100</button>

</div>

<p class="muted" style="margin-top:15px">
Deposit address
</p>

<input id="address" readonly>

<button class="secondary" onclick="copyAddress()">
Copy Address
</button>

<div class="qr">
  <img id="qr" alt="TRC20 QR">
</div>

<button onclick="paid()">
I Have Paid
</button>

<button
  class="secondary"
  style="margin-top:10px"
  onclick="checkDeposits()"
>
Check Blockchain Deposit
</button>
